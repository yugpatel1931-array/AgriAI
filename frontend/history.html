<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scan History — AgriSmart AI</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div id="site-header"></div>
  <main id="main" class="container">
    <header class="page-header">
      <h1>Scan History</h1>
      <p class="page-sub">Search and filter previous crop scans stored on this device.</p>
    </header>

    <form class="toolbar" id="filters">
      <label class="field">Search
        <input type="search" id="search" placeholder="Crop or diagnosis" autocomplete="off">
      </label>
      <label class="field">Crop
        <select id="crop-filter">
          <option value="">All crops</option>
        </select>
      </label>
      <label class="field">Risk
        <select id="risk-filter">
          <option value="">All risk levels</option>
          <option value="Low">Low</option>
          <option value="Moderate">Moderate</option>
          <option value="High">High</option>
        </select>
      </label>
      <label class="field">Date
        <select id="date-filter">
          <option value="">Any time</option>
          <option value="24h">Last 24 hours</option>
          <option value="7d">Last 7 days</option>
          <option value="30d">Last 30 days</option>
        </select>
      </label>
    </form>

    <div id="history-list" class="scan-list"></div>
  </main>
  <div id="site-footer"></div>
  <script src="js/mock-api.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="js/history.js" defer></script>
</body>
</html>
