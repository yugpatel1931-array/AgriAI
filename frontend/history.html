<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crop Scan History — AgriSmart AI</title>
  <meta name="description" content="Search, filter, and review historical crop health scans and diagnostic assessments stored on this device.">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div id="site-header"></div>

  <main id="main" class="container" style="padding-bottom:3.5rem">
    <header class="page-header">
      <div class="eyebrow">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="9"/></svg>
        <span>Diagnostic Archive</span>
      </div>
      <div style="display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:1rem">
        <div>
          <h1>Scan History</h1>
          <p class="lead" style="margin-bottom:0">Search, filter, and monitor past foliar health records across your farm.</p>
        </div>
        <div>
          <a class="btn btn-primary" href="scan.html">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
            <span>Scan New Crop</span>
          </a>
        </div>
      </div>
    </header>

    <form class="toolbar" id="filters" onsubmit="event.preventDefault()">
      <label class="field">Search diagnosis or crop
        <input type="search" id="search" placeholder="e.g. Tomato, Blight, Rust..." autocomplete="off">
      </label>
      <label class="field">Crop
        <select id="crop-filter">
          <option value="">All crops</option>
        </select>
      </label>
      <label class="field">Risk level
        <select id="risk-filter">
          <option value="">All risk levels</option>
          <option value="Low">Healthy / Low</option>
          <option value="Moderate">Moderate Risk</option>
          <option value="High">High Risk</option>
        </select>
      </label>
      <label class="field">Date interval
        <select id="date-filter">
          <option value="">All time</option>
          <option value="24h">Last 24 hours</option>
          <option value="7d">Last 7 days</option>
          <option value="30d">Last 30 days</option>
        </select>
      </label>
    </form>

    <div id="history-counter" class="muted" style="font-size:0.88rem;margin-bottom:0.8rem;font-weight:600"></div>
    <div id="history-list" class="scan-list"></div>
  </main>

  <div id="site-footer"></div>

  <script src="js/mock-api.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="js/history.js" defer></script>
</body>
</html>
