<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — AgriSmart AI</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div id="site-header"></div>
  <main id="main" class="container">
    <header class="page-header">
      <h1 id="greeting">Good morning, Farmer</h1>
      <p class="page-sub">Here's an overview of your crop health.</p>
    </header>

    <section class="kpis" id="kpis" aria-label="Crop health summary"></section>

    <section class="section" style="padding-top:1.4rem">
      <article class="card scan-promo">
        <div>
          <h2>Check Your Crop Health</h2>
          <p class="muted">Upload a leaf photo and receive an AI analysis with recommendations.</p>
        </div>
        <a class="btn btn-primary" href="scan.html">Start New Scan</a>
      </article>
    </section>

    <section class="section" style="padding-top:0">
      <div class="grid-2">
        <article class="card">
          <h2>Recent Scans</h2>
          <div id="recent-scans" class="scan-list"></div>
        </article>
        <article class="card">
          <h2>Crop Health Overview</h2>
          <p class="muted">Weekly scan activity from stored records.</p>
          <div class="chart" id="overview-chart" aria-hidden="true"></div>
        </article>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="js/mock-api.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="js/dashboard.js" defer></script>
</body>
</html>
